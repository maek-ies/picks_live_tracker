name: Update FPI Data

on:
  schedule:
    - cron: '0 0 * * 2' # Run every Tuesday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-fpi:
    runs-on: ubuntu-latest
    #container:
    #  image: rocker/r2u:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c("data.table", "jsonlite", "pak"))
        shell: Rscript {0}

      - name: Install espnscrapeR
        #run: R -q -e 'remotes::install_github("jthomasmock/espnscrapeR")'
        run: R -q -e 'pak::pkg_install("jthomasmock/espnscrapeR")'

      - name: Run FPI data update script
        run: Rscript update_fpi_data.R

      - name: Commit report
        run: |
          git config --global user.name 'Your Name'
          git config --global user.email 'your-username@users.noreply.github.com'
          #git stash
          #git pull
          #git stash pop
          git add -A
          git commit -m "save commit"
          git push --force